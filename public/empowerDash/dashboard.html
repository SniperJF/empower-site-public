<!DOCTYPE html>
<html lang="en">
  <head>
    <title>EMPOWER Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/empowerDash/dashstyle.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!-- Vendor CSS Files -->
    <!-- Template Main CSS File -->
  </head>
  <body>
    <nav class="navbar navbar-expand-sm bg-info navbar-dark">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="#">EMPOWER UNLV</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="wastelink" href="/admin/wastewater">Wastewater</a>
        </li>
      </ul>
    </nav>
    <br><br>

    <h1 class="weekHead">Weekly Website Report</h1>

    <!-- Row container -->
    <div class="flex-container">
      <!-- Stats card: Last 7 Day Views -->
      <div>
        <div class="card card--fixedWidth">
          <div class="card_head">Unique Visitors in the Last 7 Days</div>
          <div class="card__description">
            <ul class ="box-container">
              <div class="card__descriptionText" id="weekViews"></div>
              <div class="arrow" id="weekArrow" ></div>
              <div class="arrow-text" id="wArrow-text"></div>
            </ul>
          </div>
        </div>
      </div>

      <!-- Stats card: Last 7 Day Views -->
      <div>
        <div class="card card--fixedWidth">
          <div class="card_head">Top States By Unique Visitors</div>
          <div class="card__description" id="StateCard"></div>
        </div>
      </div>

      <!-- Stats card: Countries -->
      <div>
        <div class="card card--fixedWidth">
          <div class="card_head">Top Countries By Unique Visitors</div>
          <div class="card__description" id="CountryCard"></div>
        </div>
      </div>
    </div>

    <h1 class="weekHead">Overall Report</h1>
    
    <!-- Row container -->
    <div class="flex-container">
      <div class="card card--fixedWidth">
        <div class="card_head" id="chartTitle">Unique Visitors Over Selected Dates</div>
        <div class="card__description" style="height: 100%">
          <div class="card__descriptionText"></div>
          <canvas height="50" id="myChart"></canvas>
          <div>
            <label for="start">Start date:</label>
            <input type="date" id="start" name="trip-start" value="" min="2019-01-01" max="">
            <label for="start">End date:</label>
            <input type="date" id="end" name="trip-end" value="" min="2019-01-01" max="">
            <button id="checkRange">Refresh</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.onload = function() {
        fetch('/admin/env_check')
        .then((res) => {
          return res.json();
        })
        .then((data) => {
          const myLink = data;
          var url_link = myLink.data;
          url_link = url_link + '/admin/wastewater';
          console.log(url_link);
          document.getElementById('wastelink').href = url_link;

          let today = new Date();
          document.getElementById('start').valueAsDate = new Date(today.getFullYear(), today.getMonth(), 1);
          document.getElementById('end').valueAsDate = today;
        });
      }
    </script>
    <script src="/empowerDash/dashboard.js"></script>
  </body>
</html>
